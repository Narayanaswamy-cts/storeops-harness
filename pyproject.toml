[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "storeops"
version = "0.1.0"
description = "StoreOps — retail store operations management REST API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "mypy>=1.13",
    "pylint>=3.3",
    "pytest-cov>=6.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/storeops"]

# ---------------------------------------------------------------- pytest ----

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"

# ------------------------------------------------------------------ ruff ----

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "W",
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # bugbear
    "A",    # builtins shadowing
    "C4",   # comprehensions
    "SIM",  # simplify
    "TID",  # tidy imports
    "RUF",
    "ANN",  # missing annotations
    "TRY",  # tryceratops -- catches raw exception misuse
    "EM",   # no string literals straight into exceptions
]
ignore = [
    "ANN401",  # Any is used deliberately in the event-bus handler registry
    "TRY003",  # our AppError subclasses carry long default messages on purpose
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN201", "S101"]

[tool.ruff.lint.flake8-tidy-imports]
# Enforces the module-boundary rule at lint time. tests/test_boundaries.py
# enforces the same thing structurally, so a `noqa` cannot quietly defeat it.
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"storeops.modules.alerts".msg = "Notify via the event bus; never import the alerts module."

# ------------------------------------------------------------------ mypy ----

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["storeops"]
warn_unreachable = true
disallow_any_generics = true
no_implicit_reexport = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# ---------------------------------------------------------------- pylint ----

[tool.pylint.main]
source-roots = ["src", "tests"]
load-plugins = ["pylint.extensions.no_self_use"]
# Serial on purpose. With jobs = 0 pylint parallelises and its import
# resolution becomes order-dependent: it reported 18 messages on one run and
# 23 on the next, silently dropping five real E0611 errors. The harness gates
# on this score, and a gate must be deterministic, so speed is traded for
# repeatability.
jobs = 1

[tool.pylint."messages control"]
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "too-few-public-methods",   # protocols and DTOs are legitimately small
    "duplicate-code",           # the 5 modules are deliberately symmetrical stubs
]

[tool.pylint.design]
max-args = 8

[tool.pylint.format]
max-line-length = 100
